name: Pages debug

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print environment
        run: |
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Ref: $GITHUB_REF"
          echo "Commit: $GITHUB_SHA"
          echo "Files in repo root:"
          ls -la
          echo "Listing css and js:"
          ls -la css || true
          ls -la js || true
      - name: Print GH permissions
        run: |
          echo "RUNNER_OS=$RUNNER_OS"
          # show effective permissions (not fully possible), but helps debug
          env | grep GITHUB
