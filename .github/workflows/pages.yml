name: Deploy to GitHub Pages (gh-pages)

on:
  push:
    branches:
      - main

permissions:
  contents: write  # necessário para o push para gh-pages via GITHUB_TOKEN

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Se tiveres um build (ex: npm run build), adiciona-o aqui.
      # Para este repo estático, publicamos o root.
      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages        # branch alvo
          folder: '.'             # pasta a publicar (ajusta se tiveres build output)
          clean: true
          token: ${{ secrets.GITHUB_TOKEN }}
