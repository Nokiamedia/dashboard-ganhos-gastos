name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Garante que Pages está configurado corretamente
      - name: Configure Pages
        uses: actions/configure-pages@v3

      # Upload do conteúdo a publicar (ajusta `path` se usares um build output)
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: '.'

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
