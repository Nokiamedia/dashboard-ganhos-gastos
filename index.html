<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dashboard Ganhos & Gastos</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header>
    <h1>Dashboard — Ganhos & Gastos</h1>
    <p class="subtitle">Visão rápida das finanças</p>
  </header>

  <main>
    <section id="summary">
      <div class="card">
        <h2>Total</h2>
        <p id="totalValue">R$ 0,00</p>
      </div>
      <div class="card">
        <h3>Ganhos</h3>
        <p id="incomeValue">R$ 0,00</p>
      </div>
      <div class="card">
        <h3>Gastos</h3>
        <p id="expenseValue">R$ 0,00</p>
      </div>
    </section>

    <section id="agents">
      <h2>Registos</h2>
      <table id="entriesTable">
        <thead>
          <tr><th>Data</th><th>Descrição</th><th>Tipo</th><th>Valor</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <footer>
    <p>Feito com ♥ — Nokiamedia</p>
  </footer>

  <script src="/js/app.js"></script>
</body>
</html>
